    <!-- Security headers that can be expressed via meta. The rest (X-Frame-Options,
         Strict-Transport-Security, X-Content-Type-Options) must be set by the server/CDN,
         since browsers ignore them in <meta> — see README "Security" section. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';"
    />

    <title>infraAI — AI System Architecture Designer</title>

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
